<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颂光 SoraKsa · 午后白日梦</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=Ma+Shan+Zheng&display=swap');

:root{
  --dur:700ms;
  --ink:#F3EFE6;
  --bg1:#171229;
  --bg2:#2B2046;
  --accent:#E8C988;
  --soft:rgba(243,239,230,0.45);
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  min-height:100%;
  background:#0c0a14;
  font-family:'Noto Sans SC', sans-serif;
  overflow-x:hidden;
}

#stage{
  position:relative;
  width:100vw;
  min-height:100vh;
  background:linear-gradient(160deg, var(--bg1), var(--bg2));
  transition:background var(--dur) ease;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3.5rem 1rem;
  overflow:visible;
}

#ambient{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
}

#progress{
  position:absolute;
  top:28px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  z-index:5;
  opacity:0;
  transition:opacity 500ms ease;
}
#progress.show{ opacity:0.8; }
#progress .dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--soft);
  transition:background 400ms ease, transform 400ms ease;
}
#progress .dot.active{
  background:var(--accent);
  transform:scale(1.4);
}

#panel{
  position:relative;
  z-index:2;
  width:min(640px, 88vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:2.4rem;
  opacity:0;
  transform:translateY(14px);
  transition:opacity var(--dur) ease, transform var(--dur) ease;
}
#panel.in{ opacity:1; transform:translateY(0); }

.brandmark{
  font-family:'Ma Shan Zheng', cursive;
  font-size:1.6rem;
  letter-spacing:0.3em;
  color:var(--accent);
  opacity:0.85;
}

.scene-text{
  font-family:'Noto Serif SC', serif;
  font-weight:400;
  font-size:clamp(1.05rem, 2.4vw, 1.32rem);
  line-height:2.15;
  color:var(--ink);
  letter-spacing:0.02em;
  max-width:54ch;
}

.scene-text .ln{
  display:block;
  opacity:0;
  transform:translateY(8px);
  animation:rise 900ms ease forwards;
}

@keyframes rise{
  to{ opacity:1; transform:translateY(0); }
}

#choices{
  display:flex;
  flex-direction:column;
  gap:1.1rem;
  width:100%;
  max-width:420px;
}

.choice-btn{
  background:none;
  border:none;
  border-top:1px solid var(--soft);
  padding:1rem 0.4rem 0.3rem;
  font-family:'Noto Serif SC', serif;
  font-size:1rem;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  text-align:left;
  letter-spacing:0.02em;
  line-height:1.6;
  transition:opacity 300ms ease, padding-left 300ms ease;
  opacity:0.88;
}
.choice-btn:hover, .choice-btn:focus-visible{
  opacity:1;
  padding-left:0.9rem;
  outline:none;
}
.choice-btn .arrow{
  font-family:'Noto Sans SC', sans-serif;
  font-weight:300;
  color:var(--accent);
  flex-shrink:0;
  transition:transform 300ms ease;
}
.choice-btn:hover .arrow{ transform:translateX(5px); }

.continue-btn{
  background:none;
  border:1px solid var(--soft);
  border-radius:999px;
  padding:0.7rem 2.2rem;
  font-family:'Noto Sans SC', sans-serif;
  font-weight:300;
  font-size:0.92rem;
  letter-spacing:0.25em;
  color:var(--ink);
  cursor:pointer;
  opacity:0;
  animation:rise 900ms ease forwards;
  transition:background 300ms ease, opacity 300ms ease;
}
.continue-btn:hover{ background:rgba(243,239,230,0.08); }

#doors-list{
  display:flex;
  flex-direction:column;
  gap:0.85rem;
  width:100%;
}

.door-row{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  background:none;
  border:none;
  border-top:1px solid var(--soft);
  padding:0.85rem 0.2rem 0.85rem 0;
  cursor:pointer;
  text-align:left;
  transition:opacity 300ms ease, padding-left 300ms ease;
  opacity:0.88;
}
.door-row:hover, .door-row:focus-visible{
  opacity:1;
  padding-left:0.5rem;
  outline:none;
}
.door-icon{
  flex-shrink:0;
  display:block;
  filter:brightness(0.95);
  transition:filter 300ms ease;
}
.door-row:hover .door-icon{ filter:brightness(1.12); }
.door-icon svg{ display:block; width:clamp(40px, 9vw, 56px); height:auto; }

.door-text{
  font-family:'Noto Serif SC', serif;
  font-weight:400;
  font-size:0.85rem;
  line-height:1.75;
  color:var(--ink);
  letter-spacing:0.01em;
}

.doors-line{
  font-size:0.92rem;
  line-height:1.85;
  max-width:56ch;
}
.doors-outro{
  font-size:0.95rem;
  opacity:0.9;
}

.ending-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.8rem;
}

.product-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.5rem;
  padding-top:0.6rem;
}
.product-mark{
  width:34px; height:1px;
  background:var(--accent);
  opacity:0.7;
}
.product-name{
  font-family:'Noto Serif SC', serif;
  font-weight:600;
  font-size:1.3rem;
  color:var(--accent);
  letter-spacing:0.04em;
}
.product-title{
  font-family:'Noto Sans SC', sans-serif;
  font-weight:300;
  font-size:0.88rem;
  color:var(--ink);
  opacity:0.75;
  letter-spacing:0.12em;
}

.end-actions{
  display:flex;
  gap:1rem;
  margin-top:0.4rem;
  flex-wrap:wrap;
  justify-content:center;
}
.end-actions button{
  font-family:'Noto Sans SC', sans-serif;
  font-size:0.86rem;
  letter-spacing:0.1em;
  padding:0.75rem 1.6rem;
  border-radius:999px;
  cursor:pointer;
  transition:all 300ms ease;
}
.btn-primary{
  background:var(--accent);
  border:1px solid var(--accent);
  color:#241A0C;
  font-weight:500;
}
.btn-primary:hover{ filter:brightness(1.08); }
.btn-ghost{
  background:none;
  border:1px solid var(--soft);
  color:var(--ink);
}
.btn-ghost:hover{ background:rgba(243,239,230,0.08); }

.star{
  position:absolute;
  border-radius:50%;
  background:var(--ink);
  opacity:0;
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{ opacity:0; }
  50%{ opacity:0.7; }
}

.mist-blob{
  position:absolute;
  border-radius:50%;
  opacity:0.35;
  animation:drift 16s ease-in-out infinite;
}
@keyframes drift{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(20px,-14px) scale(1.08); }
}

.glow-pulse{
  animation:pulse 5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ opacity:0.55; }
  50%{ opacity:1; }
}

@media (prefers-reduced-motion: reduce){
  .scene-text .ln, .continue-btn{ animation:none; opacity:1; transform:none; }
  .star, .mist-blob, .glow-pulse{ animation:none; }
}

@media (max-width:520px){
  .scene-text{ font-size:1rem; line-height:1.95; }
}
</style>
</head>
<body>

<div id="stage">
  <div id="ambient"></div>
  <div id="progress">
    <div class="dot" data-step="1"></div>
    <div class="dot" data-step="2"></div>
    <div class="dot" data-step="3"></div>
    <div class="dot" data-step="4"></div>
  </div>
  <div id="panel"></div>
</div>

<script>
const STORY = {
  start:{
    type:'intro',
    world:'shell',
    lines:[
      '工作结束，你深陷在黄色的老沙发中。',
      '午后的阳光透过白纱窗帘落在你的脸上，你睡着了。',
      '起初什么都没有。只有阳光熟悉的温暖。',
      '渐渐地，房间开始变形。白纱窗帘变成了雾，模糊了你周边的一切。沙发沉入变得柔软的地面。你慢慢下落，直到眼前出现三扇门。'
    ],
    next:'doors'
  },

  doors:{
    type:'doors',
    world:'shell',
    step:1,
    intro:'它们并排立在一片星空下，像三个正在等待被完成的句子。',
    outro:'你走向哪扇？',
    choices:[
      {world:'a', next:'A_intro', desc:'矮而宽，拱形，漆成褪了色的蓝绿色，边缘生了锈，门缝里透出来的是一种温柔的光芒，清澈而不刺眼，像湖面的反光。'},
      {world:'b', next:'B_intro', desc:'高而窄，几乎是黑色的深棕，表面刻满了你不认识的，类似植物纹理的花纹。有什么东西在门缝里闪烁——橙的，金的，也许是黄绿的，你说不准，因为每次你直视它，它就消失了。'},
      {world:'c', next:'C_intro', desc:'是白的，方正规整的形状。但它的边缘像是在轻微地抖动，或者说，像是被风吹着的纸的边缘，虽然这里没有风。'},
      {world:'d', next:'D_intro', desc:'又高又厚重，石质表面雕刻已经斑驳的几何纹样，像是被风沙打磨了千百年。门上有一道细窄的门缝，从缝隙里钻出来阵阵热浪与若有若无的熏香。'}
    ]
  },

  A_intro:{ type:'choice', world:'a', step:2,
    text:'你站一片空旷的浅水滩上。水面平得像一面被人擦过的镜子。水不深，刚到脚踝。你站在水里，抬头看天空是正午的蓝，干净得有点不真实，没有一片云。\n似乎往哪个方向走都是一样的景色。',
    choices:[
      {label:'你选择躺下来，感受这片空无之境的平静。', next:'A_lay'},
      {label:'你选择向前走，因为远处的地平线上，有什么东西在闪烁。', next:'A_walk'}
    ]
  },
  A_lay:{ type:'choice', world:'a', step:3,
    text:'你缓缓躺下。水面托住了你的身体。你开始分不清自己与倒影的边界。草木从你的发梢生长。岩层沿着你的脊背延伸。你的呼吸变成风。你的血液变成流动的泉水。你已经成为一座从水中升起的山，从一片空无中孕育万物。',
    choices:[
      {label:'让万物生长并死亡，时间流动。', next:'A_lay_grow'},
      {label:'让万物永恒，时间静止。', next:'A_lay_still'}
    ]
  },
  A_lay_grow:{ type:'choice', world:'a', step:4,
    text:'一代又一代生命经过你的山坡。没有什么能够永远留下。生死流转，能量循环。风景不断变化。你发现自己每天醒来时，看到的都是不同的世界。',
    choices:[
      {label:'享受这些变化。', next:'end_helios1'},
      {label:'试着记住一切。', next:'end_yuzu1'}
    ]
  },
  A_lay_still:{ type:'choice', world:'a', step:4,
    text:'万物陷入沉睡，但你在它们的梦里听见，许多生命渴望变化与冒险。',
    choices:[
      {label:'为它们编织无尽的精彩梦境。', next:'end_yuzu2'},
      {label:'让它们苏醒，面对流逝的时间。', next:'end_helios2'}
    ]
  },
  A_walk:{ type:'choice', world:'a', step:3,
    text:'你不断向前，地平线那端闪烁的来源越来越清晰。那是一只由纯粹光芒构成的金色飞鸟。它悬停在水面上，意识到你的到来，朝你发出一声长鸣。',
    choices:[
      {label:'你好奇地靠近，试图用手触摸它。', next:'A_walk_touch'},
      {label:'你和它保持距离，观察它的反应。', next:'A_walk_distance'}
    ]
  },
  A_walk_touch:{ type:'choice', world:'a', step:4,
    text:'飞鸟在你碰到它的瞬间变成了光的溪流，包裹了你的全身。你已经成为光的一部分，从此要在世界的夜晚和白昼间飞行，往复不断。但你发现你的倒影留在了原地。',
    choices:[
      {label:'抛下你的影子，向世界尽头飞行。', next:'end_helios3'},
      {label:'回到影子身边。', next:'end_yuzu3'}
    ]
  },
  A_walk_distance:{ type:'choice', world:'a', step:4,
    text:'飞鸟转身，正用你难以企及的速度向远方飞去，但它也在回头看你，似乎示意你跟上它。',
    choices:[
      {label:'跟上它。', next:'end_helios4'},
      {label:'目送它离开。', next:'end_yuzu4'}
    ]
  },

  end_helios1:{ type:'end', world:'a', product:'不坠金芒 Helios', title:'追问生命的逐光者',
    text:'你看着花开花落，云聚云散。某一天，你忽然发现天边始终有一只耀眼的金色的飞鸟，正随着时间不断向前。你没有试图留住它，只是目送它飞过。' },
  end_yuzu1:{ type:'end', world:'a', product:'柚见山风 Yuzu Breeze', title:'拥抱万物的随风者',
    text:'你收集每一个季节留下的痕迹。多年以后，风穿过柚树林时，你从空气里认出许多令你怀念的气息。有些东西虽然消失了，却从未真正离开。' },
  end_yuzu2:{ type:'end', world:'a', product:'柚见山风 Yuzu Breeze', title:'拥抱万物的随风者',
    text:'你为沉睡的世界不断编织精彩而荒诞的变化：森林迁徙、海洋漂浮。渐渐地，梦渗透了现实。万物的永恒开始松动。某一天，风第一次真正吹了起来，带着一阵清新的绿色香气，像柚叶新芽的呼吸，轻轻掠过即将变化如梦的世界。' },
  end_helios2:{ type:'end', world:'a', product:'不坠金芒 Helios', title:'追问生命的逐光者',
    text:'万物在同一个清晨醒来。种子破土，候鸟起飞，河流重新找到方向。然后你看见它：那只金色的飞鸟，从山顶升起，像是一直在这里等着这一刻。它飞起来的瞬间，阳光重新开始移动。' },
  end_helios3:{ type:'end', world:'a', product:'不坠金芒 Helios', title:'追问生命的逐光者',
    text:'太阳从不停止前进。当凡人说它落下时，它只是正驶向另一片需要光明的国土。你明白：有些道路并非因为看见终点才出发。' },
  end_yuzu3:{ type:'end', world:'a', product:'柚见山风 Yuzu Breeze', title:'拥抱万物的随风者',
    text:'你周身的光芒与你的影子交融在一起，如同斑驳的阳光与树荫。你听见自己的身体内部发出植物抽芽生长的声音，风中传来夏日雨水的气息。' },
  end_helios4:{ type:'end', world:'a', product:'不坠金芒 Helios', title:'',
    text:'你追随飞鸟穿过无边无际的天空。它飞得越来越高，直到化作太阳的一部分。你得以站在它的翅膀上游历世界。' },
  end_yuzu4:{ type:'end', world:'a', product:'柚见山风 Yuzu Breeze', title:'拥抱万物的随风者',
    text:'飞鸟逐渐消失在天际。世界重新恢复安静。你平静地感到有风吹过镜面般的水面，细碎的波纹扩散开来，风中淡淡的柚香。你没有追上去，但你也没有失去什么。' },

  B_intro:{ type:'choice', world:'b', step:2,
    text:'永恒夜晚的热带雨林笼罩在银色月光中。林间的光点忽明忽灭，不知道是萤火虫、动物眼睛，还是别的什么存在正观察你。你身后的入口已经消失。雨林在合拢。你必须找到出路。',
    choices:[
      {label:'顺着河流走，水往低处去，低处也许有出口。', next:'B_river'},
      {label:'往森林深处的高地走，登高才能看远。', next:'B_hill'}
    ]
  },
  B_river:{ type:'choice', world:'b', step:3,
    text:'你听见流水声里似乎有许多声音在小声低语，它们情绪各异，有的温柔平静，有的愤怒，有的悲伤。',
    choices:[
      {label:'仔细听他们在讲什么。', next:'B_river_listen'},
      {label:'心无旁骛，继续走出雨林。', next:'B_river_ignore'}
    ]
  },
  B_river_listen:{ type:'choice', world:'b', step:4,
    text:'这些声音并不是单一的对话，而是许多个生命在不同时间留下的片段。你觉得十分有趣。',
    choices:[
      {label:'留下，在永恒的月光中倾听河流。', next:'end_moonlight1'},
      {label:'带着雨林的回声离开，走向外面的世界。', next:'end_cinnamon1'}
    ]
  },
  B_river_ignore:{ type:'choice', world:'b', step:4,
    text:'你走到一片开阔地，河流汇入一片湖。你看到一只蓝眼睛的白猫坐在湖边的石头上，沐浴着永恒的月光。她捞起湖水，水中的杂乱声音在她爪子中被整理成悦耳的故事。',
    choices:[
      {label:'闭上眼睛，安静地听她的故事。', next:'end_moonlight2'},
      {label:'问她如何走出雨林。', next:'end_cinnamon2'}
    ]
  },
  B_hill:{ type:'choice', world:'b', step:3,
    text:'你走进树最密的地方，坡一直往上，月光却越来越稀薄。那些忽明忽灭的光跟了你一段，然后消失了。走着走着，肚子开始叫。上坡的路没有尽头，你已经分不清来时的方向。你在雨林里迷了路。',
    choices:[
      {label:'坐下来休息。', next:'B_hill_rest'},
      {label:'继续走，仔细辨别气味或声音的线索。', next:'B_hill_continue'}
    ]
  },
  B_hill_rest:{ type:'choice', world:'b', step:4,
    text:'你坐在石头上，等着。雨林还是那个样子，闷热，没有尽头。肚子又叫了一声。你靠着树干，眼皮越来越重，然后就睡着了。你做了一个梦。梦里有好吃的，香味从某个地方源源不断地飘来。你不知道那是什么，但你知道那是你目前最想要的东西。',
    choices:[
      {label:'留在梦里。', next:'end_moonlight3'},
      {label:'醒来！还要继续找路呢。', next:'end_cinnamon3'}
    ]
  },
  B_hill_continue:{ type:'choice', world:'b', step:4,
    text:'空气里有两个方向——后方传来某种甜的、烘烤过的、带着香料的气味；前方有声音，很轻，像有人在低声说话，或者唱歌，你说不准。',
    choices:[
      {label:'往前走，跟着声音。', next:'end_moonlight4'},
      {label:'回头，跟着气味。', next:'end_cinnamon4'}
    ]
  },

  end_moonlight1:{ type:'end', world:'b', product:'Moonlight Scribe', title:'编织夜色的入梦者',
    text:'你不再急着往前走，而是坐在河边，让那些声音慢慢穿过你。时间变得松散，你开始分不清自己是听者还是河流的一部分。' },
  end_cinnamon1:{ type:'end', world:'b', product:'Cinnamon Sniffer', title:'眷恋烟火的寻味者',
    text:'你在河流中仔细辨别，找到了走出雨林的线索。那些声音在你身后继续讲述，但你已经不再回头。你带着河流里的生命经验走出雨林——柔软的羽毛床和热乎乎的美食在等着你。' },
  end_moonlight2:{ type:'end', world:'b', product:'Moonlight Scribe', title:'编织夜色的入梦者',
    text:'你坐在湖边，没有打断她。她的声音不像语言，介于说话和唱歌之间，像某种正在被拼接的梦。听着听着，有什么轻轻跳上你的膝头，带着重量与温度。是那只白猫，正蜷在你腿上打呼噜。你忽然觉得，出路这件事可以晚一点再想。' },
  end_cinnamon2:{ type:'end', world:'b', product:'Cinnamon Sniffer', title:'眷恋烟火的寻味者',
    text:'白猫大笑，没有直接回答，只是说："看看你身后，是谁一直在偷偷跟着你？"你这才隐约想起有一个远远跟着你的黑影，风从它身上带来橘皮与肉桂的气息。或许这个鬼鬼祟祟的小东西能带你走出雨林？' },
  end_moonlight3:{ type:'end', world:'b', product:'Moonlight Scribe', title:'编织夜色的入梦者',
    text:'你决定不醒。梦里没有饥饿，也没有必须要去的地方。你跟着香味往梦的深处走，然后走进一片月光里。一只蓝眼睛白猫坐在那里，你莫名觉得它在等你。你坐下来，它把头搁在你的腿上。你摸着它柔软蓬松的毛发，觉得留在雨林也没什么不好。' },
  end_cinnamon3:{ type:'end', world:'b', product:'Cinnamon Sniffer', title:'眷恋烟火的寻味者',

  end_moonlight4:{ type:'end', world:'b', product:'Moonlight Scribe', title:'编织夜色的入梦者',

  end_cinnamon4:{ type:'end', world:'b', product:'Cinnamon Sniffer', title:'眷恋烟火的寻味者',

  end_halcyon2:{ type:'end', world:'c', product:'Halcyon 翠鸟之梦', title:'安抚灵魂的守望者',

  end_mistcity2:{ type:'end', world:'c', product:'The Mist-City Adventurer 雾都冒险家', title:'奔向未来的破雾者',

  end_halcyon3:{ type:'end', world:'c', product:'Halcyon 翠鸟之梦', title:'安抚灵魂的守望者',

  end_halcyon4:{ type:'end', world:'c', product:'Halcyon 翠鸟之梦', title:'安抚灵魂的守望者',

const THEMES = {
  shell:{ bg1:'#171229', bg2:'#2B2046', ink:'#F3EFE6', accent:'#E8C988', soft:'rgba(243,239,230,0.45)', mode:'dark' },
  a:{ bg1:'#DCEEEA', bg2:'#9FC9C4', ink:'#1E3A38', accent:'#3E7C7A', soft:'rgba(30,58,56,0.35)', mode:'light' },
  b:{ bg1:'#0E1410', bg2:'#1F3324', ink:'#D9E3DA', accent:'#E2A84B', soft:'rgba(217,227,218,0.35)', mode:'dark' },
  c:{ bg1:'#5B4B7A', bg2:'#D98A6B', ink:'#FBF1E6', accent:'#F4D58D', soft:'rgba(251,241,230,0.4)', mode:'dark' },
  d:{ bg1:'#3A2A1C', bg2:'#8C6A42', ink:'#F2E6D2', accent:'#E0A35C', soft:'rgba(242,230,210,0.4)', mode:'dark' }
};

const stage = document.getElementById('stage');
const panel = document.getElementById('panel');
const ambient = document.getElementById('ambient');
const progress = document.getElementById('progress');

let currentWorld = 'shell';

function applyTheme(world){
  const t = THEMES[world];
  stage.style.setProperty('--bg1', t.bg1);
  stage.style.setProperty('--bg2', t.bg2);
  stage.style.setProperty('--ink', t.ink);
  stage.style.setProperty('--accent', t.accent);
  stage.style.setProperty('--soft', t.soft);
  currentWorld = world;
  renderAmbient(world);
}

function renderAmbient(world){
  ambient.innerHTML = '';
  if(world === 'shell' || world === 'c'){
    for(let i=0;i<26;i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random()*100+'%';
      s.style.top = Math.random()*70+'%';
      const size = Math.random()*2+1;
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.animationDelay = (Math.random()*4)+'s';
      ambient.appendChild(s);
    }
  }
  if(world === 'b'){
    for(let i=0;i<3;i++){
      const m = document.createElement('div');
      m.className = 'mist-blob';
      m.style.background = `radial-gradient(circle, ${THEMES.b.accent} 0%, transparent 70%)`;
      m.style.width = (180+Math.random()*120)+'px';
      m.style.height = m.style.width;
      m.style.left = (10+Math.random()*70)+'%';
      m.style.top = (10+Math.random()*70)+'%';
      m.style.animationDelay = (Math.random()*6)+'s';
      ambient.appendChild(m);
    }
  }
  if(world === 'd'){
    const m = document.createElement('div');
    m.className = 'mist-blob glow-pulse';
    m.style.background = `radial-gradient(circle, ${THEMES.d.accent} 0%, transparent 70%)`;
    m.style.width = '260px';
    m.style.height = '260px';
    m.style.left = '50%';
    m.style.top = '60%';
    m.style.transform = 'translate(-50%,-50%)';
    ambient.appendChild(m);
  }
  if(world === 'a'){
    const m = document.createElement('div');
    m.className = 'mist-blob';
    m.style.background = 'radial-gradient(ellipse, #ffffff 0%, transparent 70%)';
    m.style.width = '320px';
    m.style.height = '90px';
    m.style.left = '50%';
    m.style.top = '78%';
    m.style.transform = 'translate(-50%,-50%)';
    m.style.opacity = '0.18';
    ambient.appendChild(m);
  }
}

function updateProgress(step){
  if(!step){
    progress.classList.remove('show');
    return;
  }
  progress.classList.add('show');
  [...progress.children].forEach(d=>{
    d.classList.toggle('active', parseInt(d.dataset.step) <= step);
  });
}

function doorSVG(world){
  const t = THEMES[world];
  const cfgs = {
    a: { w:78, h:118, top:'arch', fill:`linear-gradient(160deg, ${t.bg2}, ${t.bg1})`, leak: t.accent },
    b: { w:64, h:130, top:'flat', fill:`linear-gradient(160deg, #1c140d, #2e2014)`, leak: '#E2A84B' },
    c: { w:78, h:114, top:'flat', fill:`linear-gradient(160deg, #f4f0e6, #e3ded0)`, leak: '#D98A6B', jitter:true },
    d: { w:82, h:128, top:'arch2', fill:`linear-gradient(160deg, #8c6a42, #5c4326)`, leak: '#E0A35C' }
  };
  const c = cfgs[world];
  const gid = 'g_'+world;
  let topPath = '';
  if(c.top === 'arch'){
    topPath = `M4,${c.h} V40 Q4,4 ${c.w/2},4 Q${c.w-4},4 ${c.w-4},40 V${c.h} Z`;
  } else if(c.top === 'arch2'){
    topPath = `M2,${c.h} V30 Q2,2 ${c.w/2},2 Q${c.w-2},2 ${c.w-2},30 V${c.h} Z`;
  } else {
    topPath = `M4,${c.h} V14 Q4,4 14,4 H${c.w-14} Q${c.w-4},4 ${c.w-4},14 V${c.h} Z`;
  }
  let texture = '';
  if(world === 'b'){
    texture = `<g stroke="#3a2c1a" stroke-width="0.6" opacity="0.5" fill="none">
      <path d="M14,20 Q24,40 16,65 Q10,85 22,${c.h-10}"/>
      <path d="M${c.w-16},25 Q${c.w-26},50 ${c.w-14},75 Q${c.w-8},95 ${c.w-20},${c.h-8}"/>
      <path d="M${c.w/2-4},10 Q${c.w/2+6},45 ${c.w/2-6},90"/>
    </g>`;
  }
  if(world === 'd'){
    let diamonds = '';
    for(let y=18; y<c.h-10; y+=16){
      diamonds += `<rect x="${c.w/2-5}" y="${y}" width="8" height="8" transform="rotate(45 ${c.w/2-1} ${y+4})" fill="none" stroke="#3a2a1c" stroke-width="0.6" opacity="0.55"/>`;
    }
    texture = `<g>${diamonds}</g>`;
  }
  if(world === 'c'){
    texture = `<path d="M5,${c.h} V16 Q5,8 14,7 Q22,5 30,7 Q40,9 50,7 Q60,5 68,7 Q${c.w-6},9 ${c.w-5},16 V${c.h}" fill="none" stroke="#b9b2a0" stroke-width="0.6" opacity="0.7"/>`;
  }
  if(world === 'a'){
    texture = `<g stroke="#0f2e2c" stroke-width="0.7" opacity="0.4" fill="none">
      <path d="M10,${c.h-6} Q${c.w/2},${c.h-14} ${c.w-10},${c.h-6}"/>
      <path d="M14,${c.h-20} Q${c.w/2},${c.h-28} ${c.w-14},${c.h-20}"/>
    </g>`;
  }
  return `
  <svg viewBox="0 0 ${c.w} ${c.h+6}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        ${world==='a' ? `<stop offset="0%" stop-color="${t.bg2}"/><stop offset="100%" stop-color="${t.bg1}"/>` :
          world==='b' ? `<stop offset="0%" stop-color="#1c140d"/><stop offset="100%" stop-color="#2e2014"/>` :
          world==='c' ? `<stop offset="0%" stop-color="#f4f0e6"/><stop offset="100%" stop-color="#e3ded0"/>` :
          `<stop offset="0%" stop-color="#8c6a42"/><stop offset="100%" stop-color="#5c4326"/>` }
      </linearGradient>
      <filter id="blur_${world}"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <path d="${topPath}" fill="url(#${gid})" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
    ${texture}
    <rect x="${c.w/2-1.1}" y="10" width="2.2" height="${c.h-16}" fill="${c.leak}" opacity="0.85" filter="url(#blur_${world})"/>
    <rect x="${c.w/2-0.5}" y="10" width="1" height="${c.h-16}" fill="${c.leak}" opacity="0.95"/>
  </svg>`;
}

function fadeTo(html, world, step){
  panel.classList.remove('in');
  setTimeout(()=>{
    applyTheme(world);
    updateProgress(step);
    panel.innerHTML = html;
    bindHandlers();
    requestAnimationFrame(()=>panel.classList.add('in'));
  }, 350);
}

function bindHandlers(){
  panel.querySelectorAll('[data-next]').forEach(el=>{
    el.addEventListener('click', ()=>render(el.dataset.next));
  });
  panel.querySelectorAll('[data-restart]').forEach(el=>{
    el.addEventListener('click', ()=>render('start'));
  });
}

function linesHTML(lines){
  return lines.map((l,i)=>`<span class="ln" style="animation-delay:${0.3+i*0.55}s">${l}</span>`).join('');
}

function render(id){
  const node = STORY[id];

  if(node.type === 'intro'){
    const html = `
      <div class="brandmark">颂光 SoraKsa</div>
      <p class="scene-text">${linesHTML(node.lines)}</p>
      <button class="continue-btn" data-next="${node.next}" style="animation-delay:${0.3+node.lines.length*0.55+0.5}s">继续</button>
    `;
    fadeTo(html, node.world, null);
    return;
  }

  if(node.type === 'doors'){
    const introHtml = `<span class="ln" style="animation-delay:0.1s">${node.intro}</span>`;
    const rows = node.choices.map((ch,i) => `
      <button class="door-row" data-next="${ch.next}" aria-label="进入${ch.world}号门">
        <span class="door-icon">${doorSVG(ch.world)}</span>
        <span class="door-text">${ch.desc}</span>
      </button>
    `).join('');
    const html = `
      <p class="scene-text doors-line">${introHtml}</p>
      <div id="doors-list">${rows}</div>
      <p class="scene-text doors-line doors-outro"><span class="ln" style="animation-delay:0.1s">${node.outro}</span></p>
    `;
    fadeTo(html, node.world, node.step);
    return;
  }

  if(node.type === 'choice'){
    const paras = node.text.split('\n').map(p=>`<span class="ln">${p}</span>`).join('');
    const choices = node.choices.map(ch => `
      <button class="choice-btn" data-next="${ch.next}">
        <span>${ch.label}</span><span class="arrow">→</span>
      </button>
    `).join('');
    const html = `
      <p class="scene-text">${paras}</p>
      <div id="choices">${choices}</div>
    `;
    fadeTo(html, node.world, node.step);
    return;
  }

  if(node.type === 'end'){
    const html = `
      <div class="ending-wrap">
        <p class="scene-text">${node.text}</p>
        <div class="product-card">
          <div class="product-mark"></div>
          <div class="product-name">${node.product}</div>
          ${node.title ? `<div class="product-title">${node.title}</div>` : ''}
        </div>
        <div class="end-actions">
          <button class="btn-primary" type="button">了解这款香气</button>
          <button class="btn-ghost" data-restart type="button">再做一次测试</button>
        </div>
      </div>
    `;
    fadeTo(html, node.world, null);
    return;
  }
}

render('start');
</script>
</body>
</html>
